name: Sync Docker Hub Overview

on:
  push:
    branches: [master]
    paths:
      - Readme.md
      - .github/workflows/dockerhub-overview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-overview
  cancel-in-progress: false

jobs:
  overview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Sync overview and short description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
          repository: tingfe/lx-music-sync-server
          short-description: Private LX Music sync for playlists, sources, preferences and online car control.
          readme-filepath: ./Readme.md
          enable-url-completion: true
      - name: Verify public overview
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const response = await fetch('https://hub.docker.com/v2/repositories/tingfe/lx-music-sync-server/');
          if (!response.ok) throw new Error('Overview read-back failed: HTTP ' + response.status);
          const repository = await response.json();
          const text = repository.full_description ?? '';
          if (!text.includes('LX Music 私有同步服务') || !text.includes('CUSTOM_SOURCE_SYNC_UPGRADE.md')) {
            throw new Error('Overview content verification failed');
          }
          console.log('Docker Hub Overview published and verified (' + Buffer.byteLength(text) + ' bytes).');
          JS
