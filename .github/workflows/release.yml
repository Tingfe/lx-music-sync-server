name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build source code
        run: npm run build

      - name: Get package version
        run: echo "PACKAGE_VERSION=$(node -p \"require('./package.json').version\")" >> "$GITHUB_ENV"

      - name: Create release archive
        run: zip -r "lx-music-sync-server_v${PACKAGE_VERSION}.zip" server ecosystem.config.js config.js index.js package-lock.json package.json LICENSE Readme.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${PACKAGE_VERSION}"
          archive="lx-music-sync-server_v${PACKAGE_VERSION}.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive" --clobber
          else
            gh release create "$tag" "$archive" --title "$tag" --notes-file ./publish/changeLog.md
          fi

      - name: Generate archive MD5
        run: md5sum *.zip
